<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Rate Case Workbench</title>
<style>
  :root { --blue:#1d4ed8; --slate:#475569; --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:#0f172a; line-height:1.5;
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:28px; width:100%; max-width:360px; box-shadow:0 4px 18px rgba(15,42,92,.08); }
  h1 { margin:0 0 4px; font-size:20px; color:#0f2a5c; }
  p { margin:0 0 16px; color:var(--slate); font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--slate); margin-bottom:6px; }
  input { width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line);
          border-radius:8px; margin-bottom:12px; }
  button { width:100%; background:var(--blue); color:#fff; border:0; border-radius:8px;
           padding:11px; font-size:15px; font-weight:700; cursor:pointer; }
  button:hover { background:#1e40af; }
  .err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:8px;
         padding:9px 12px; font-size:14px; margin-bottom:12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Rate Case Workbench</h1>
    <p>Team sign-in. One password for everybody — ask Eric if you need it.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
